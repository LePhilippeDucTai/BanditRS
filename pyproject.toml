# Python packaging for BanditRS.
#
# The wheel is a *binary* wheel: maturin compiles the Rust crate and ships the
# four executables (`bandit`, `banditrs`, `bandit-baseline`,
# `bandit-config-generator`) into the environment's scripts directory. The
# `python/banditrs` package alongside them is a thin locator/launcher, not a
# reimplementation — see python/banditrs/__init__.py.
#
# Because the binaries do not link against libpython, the wheels are tagged
# `py3-none-<platform>`: one wheel per OS/architecture, valid for every Python
# version. Hence six wheels total, and no Python-version matrix in
# .github/workflows/release.yml.

[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "banditrs"
description = "The Python security linter bandit, rewritten in pure Rust: same tests, same options, same outputs, same exit codes — much faster."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "LePhilippeDucTai" }]
keywords = ["security", "linter", "python", "bandit", "static-analysis", "sast"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python",
    "Programming Language :: Rust",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
# Read from Cargo.toml by maturin: the crate version is the single source of truth.
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/LePhilippeDucTai/BanditRS"
Repository = "https://github.com/LePhilippeDucTai/BanditRS"
Issues = "https://github.com/LePhilippeDucTai/BanditRS/issues"

# NOTE: no [project.scripts] here, and none possible — maturin rejects the
# combination outright ("Defining scripts and working with a binary doesn't mix
# well"). None is needed: all four commands are native executables.

[tool.maturin]
bindings = "bin"
python-source = "python"
strip = true
# Session tooling, not part of the distribution.
exclude = [".claude/**"]
