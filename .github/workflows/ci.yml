# Continuous integration for BanditRS.
#
# Four independent jobs so that one failure never hides another:
#   test   — build every target and run the whole suite (unit + integration),
#            then print the work-package dashboard.
#   lint   — rustfmt + clippy with `-D warnings` (the repository's standing rule).
#   bench  — compile the criterion benches (no measurement in CI; see
#            docs/plan/benchmarks.md for the perf gate strategy).
#   python — build the Python wheel and prove the `pip install` promise holds.
#
# `scripts/check.sh` reproduces the first three jobs locally, and
# `scripts/check.sh python` the fourth.
#
# Cost: this repository is public, so every job here runs on standard
# GitHub-hosted runners, which are free with unlimited minutes. No job requests
# a larger runner (those are billed even for public repositories).
name: CI

on:
  push:
    branches: ["main", "claude/**", "wp/**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: test (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --all-targets --locked
      - run: cargo test --all-targets --locked
      - name: Work-package dashboard
        run: scripts/wp_status.sh --check

  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings

  bench:
    name: benches compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo bench --no-run --locked

  python:
    name: python wheel
    runs-on: ubuntu-latest
    # The release workflow builds the same wheel on six platforms; this job is
    # the fast feedback loop that catches packaging breakage on every push,
    # long before a tag is cut.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Exactly the code path `pip install git+https://…` takes: PEP 517 build
      # in an isolated environment, with maturin as the backend.
      - name: pip install .
        run: python -m pip install --verbose .

      - name: Smoke-test the four commands
        run: |
          set -euo pipefail
          bandit --version
          banditrs --version
          bandit-baseline --help > /dev/null
          bandit-config-generator --show-defaults > /dev/null
          bandit -r examples/ --exit-zero
          python -m banditrs --version
          python -c "import banditrs; print(banditrs.__version__, banditrs.find_bandit_bin())"

      # The sdist is attached to every release and is what a package index
      # would fall back to, so it has to be self-contained — it is built from a
      # different code path than the wheel above (maturin's own file selection
      # rather than pip's checkout). Proving it installs here avoids discovering
      # the breakage at tag time.
      - name: Source distribution builds and installs
        run: |
          set -euo pipefail
          python -m pip install maturin
          maturin sdist --out dist
          python -m pip install --force-reinstall dist/*.tar.gz
          bandit --version
